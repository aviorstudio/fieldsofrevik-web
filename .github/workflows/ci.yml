name: "Build & Test"

# Every pull request and every merge to main: build, then test, on one runner.
#
# This repository had NO .github at all, while its three sibling -web repos --
# gdam-web, gdlint-web, termcade-web -- all had CI. Nothing has ever checked it.
#
# The push trigger is not redundant: there is no CD here, so nothing else covers
# a merge to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Test"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable.
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .mise.toml, which is where bun's version is pinned -- the same
      # arrangement the four sibling -web repos use. This repository was the odd
      # one out on pnpm with no .mise.toml at all.
      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        uses: nicodes/tools/integration-identity@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: "Set up tools"
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: "Validate workflow standards"
        uses: nicodes/tools/workflow-standards@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1

      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
