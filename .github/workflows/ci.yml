name: CI

# Every pull request and every merge to main: build, then test, on one runner.
#
# This repository had NO .github at all, while its three sibling -web repos --
# gdam-web, gdlint-web, termcade-web -- all had CI. Nothing has ever checked it.
#
# The push trigger is not redundant: there is no CD here, so nothing else covers
# a merge to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads .mise.toml, which is where bun's version is pinned -- the same
      # arrangement the four sibling -web repos use. This repository was the odd
      # one out on pnpm with no .mise.toml at all.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Validate developer profile and workflow controls
        uses: nicodes/tools/workflow-standards@cf0e560c9bbb888488191fcce03409b6c6fbdc28 # v0.13.0

      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test
